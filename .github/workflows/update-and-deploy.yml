name: Update data & deploy

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 min (GitHub may delay scheduled runs at busy times)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_gfw:
        description: "Refresh slow sources now (fishing, airport, policy, military; normally every 3-12 h)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch data
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          PREV_BASE_URL: ${{ steps.pages.outputs.base_url }}
          AIS_LISTEN_SECONDS: ${{ vars.AIS_LISTEN_SECONDS || '150' }}
          FORCE: ${{ inputs.force_gfw && '1' || '' }}
        run: python scripts/update_all.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
